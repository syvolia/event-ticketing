name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Postgres runs as a service container. The health check option is what
    # makes the job wait for readiness instead of racing the first connection.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ticketing:ticketing@localhost:5432/ticketing
      JWT_SECRET: ci-secret-do-not-use-in-production-0123456789
      LOG_LEVEL: fatal
      RATE_LIMIT_ENABLED: 'false'
      INVENTORY_IMPL: conditional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Migrations run against the service container before tests. The
      # test's global-setup also creates a `ticketing_test` DB, so this is
      # really just a smoke test that migrations apply cleanly on a fresh DB.
      - run: npm run migrate
      - run: npm test --workspace=@ticketing/api
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: apps/api/test-results
          if-no-files-found: ignore

  # Second run of the concurrency suite with the alternate inventory
  # implementation. The matrix proves both implementations satisfy the same
  # invariants, so a future change that breaks one is caught even if the
  # other still passes.
  test-alt-inventory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ticketing:ticketing@localhost:5432/ticketing
      JWT_SECRET: ci-secret-do-not-use-in-production-0123456789
      LOG_LEVEL: fatal
      RATE_LIMIT_ENABLED: 'false'
      INVENTORY_IMPL: for-update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate
      - run: npm test --workspace=@ticketing/api -- concurrency

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max