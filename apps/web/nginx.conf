server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback. Real files serve as-is; anything else gets index.html and
  # React Router handles the route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed assets. Vite fingerprints filenames, so a new build
  # produces new URLs and stale ones are never requested.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker must always be re-validated, otherwise a client can be
  # pinned to an old build forever.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}